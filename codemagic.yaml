workflows:
  ios-build:
    name: Build iOS IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.example.hadoor"
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Set up Flutter
        script: |
          set -e
          echo "Setting up Flutter..."
          flutter upgrade
          flutter doctor -v
          
      - name: Get project dependencies
        script: |
          flutter pub get
          
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod repo update || true
          pod install --repo-update || pod install
          cd ..
          
      - name: Build iOS IPA (No Codesign)
        script: |
          flutter build ipa \
            --no-codesign \
            --verbose
            
      - name: Check build output
        script: |
          echo "Checking for IPA file..."
          ls -la build/ios/ipa/ || echo "IPA directory not found"
          find build -name "*.ipa" -type f || echo "No IPA files found"
    artifacts:
      - build/ios/ipa/**/*.ipa
    publishing:
      email: murtadalgobory@gmail.com
        recipients:
          - $DEVELOPER_EMAIL
        notify:
          success: true
          failure: true
